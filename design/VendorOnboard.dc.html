<style>

.font-sans{font-family:'Lato',system-ui,sans-serif}

button,input,textarea{font-family:inherit}

<div class="font-sans" style="width: 390px; height: 844px; overflow: hidden; background: #fff4d6; color: #23262f; display: flex; flex-direction: column; padding: 1.75rem 1.25rem 1.25rem; box-sizing: border-box; gap: 1.25rem">

<div style="display: flex; flex-direction: column; gap: 0.5rem">

<div style="font-size: 0.9375rem">Customers will see this on your profile.</div>

<div style="display: flex; flex-direction: column; gap: 0.5rem">

<div style="display: flex; flex-direction: column; gap: 0.5rem" role="radiogroup" aria-label="Category">

<div style="display: flex; flex-wrap: wrap; gap: 0.5rem">
<span style="padding: 0.5rem 0.875rem; border-radius: 999px; border: 1px solid #d9b8ff; background: #ffffff; font-size: 0.875rem">Hall</span>
<span style="padding: 0.5rem 0.875rem; border-radius: 999px; background: #263baa; color: #ffffff; font-size: 0.875rem; font-weight: 700">DJ / Sound</span>
<span style="padding: 0.5rem 0.875rem; border-radius: 999px; border: 1px solid #d9b8ff; background: #ffffff; font-size: 0.875rem">Cameraman</span>
<span style="padding: 0.5rem 0.875rem; border-radius: 999px; border: 1px solid #d9b8ff; background: #ffffff; font-size: 0.875rem">Cook</span>
<span style="padding: 0.5rem 0.875rem; border-radius: 999px; border: 1px solid #d9b8ff; background: #ffffff; font-size: 0.875rem">Band</span>
<span style="padding: 0.5rem 0.875rem; border-radius: 999px; border: 1px solid #d9b8ff; background: #ffffff; font-size: 0.875rem">Car</span>
<span style="padding: 0.5rem 0.875rem; border-radius: 999px; border: 1px solid #d9b8ff; background: #ffffff; font-size: 0.875rem">Catering</span>
<span style="padding: 0.5rem 0.875rem; border-radius: 999px; border: 1px solid #d9b8ff; background: #ffffff; font-size: 0.875rem">Decoration</span>
<span style="padding: 0.5rem 0.875rem; border-radius: 999px; border: 1px solid #d9b8ff; background: #ffffff; font-size: 0.875rem">+ More</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 0.5rem">
<label for="ar" style="font-size: 0.875rem; font-weight: 700">Area (Prayagraj)</label>
<input id="ar" type="text" placeholder="e.g. Civil Lines, Naini, Jhunsi" style="height: 3.5rem; border-radius: 0.75rem; border: 1.5px solid #d9b8ff; background: #ffffff; padding: 0 1rem; font-size: 1rem; color: #23262f; box-sizing: border-box">
</div>

<div style="display: flex; flex-direction: column; gap: 0.5rem">
<label for="ab" style="font-size: 0.875rem; font-weight: 700">About you (2–3 lines)</label>
<textarea id="ab" rows="3" placeholder="Years of experience, what makes you special" style="border-radius: 0.75rem; border: 1.5px solid #d9b8ff; background: #ffffff; padding: 0.75rem 1rem; font-size: 1rem; color: #23262f; resize: none"></textarea>
</div>

<div style="flex-grow: 1"></div>

<a href="VendorDocs.dc.html" style="height: 3.5rem; border-radius: 0.75rem; background: #263baa; color: #ffffff; font-size: 1.0625rem; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Continue</a>
