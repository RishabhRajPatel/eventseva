</div>
<span style="font-size: 0.8125rem; font-weight: 700">Android round icon</span>

<div style="display: flex; flex-direction: column; align-items: center; gap: 0.75rem">
<div style="width: 7.5rem; height: 7.5rem; border-radius: 1.75rem; background: #312e81; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.25rem">
<span class="font-display" style="font-size: 3.5rem; line-height: 1; font-weight: 700; color: #ffffff">E</span>

<span class="font-display" style="font-size: 1.75rem; line-height: 1; font-weight: 700; color: #ffffff">E</span>
